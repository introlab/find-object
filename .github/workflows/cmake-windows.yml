name: CMake-Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # Prebuilt vcpkg exports (Qt6, OpenCV with contrib/nonfree, zlib, and for the
  # CUDA one OpenCV with CUDA and libtorch) published with rtabmap releases,
  # built with rtabmap's bundle_windows_deps.bat and bundle_windows_deps_cuda.bat.
  VCPKG_BUNDLE_RELEASE: https://github.com/introlab/rtabmap/releases/download/0.23.8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.build_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build_name: [windows-2022, windows-2022-cuda]
        include:
        - build_name: windows-2022
          os: windows-2022
          vcpkg_bundle: vcpkg-export-66c0373d-x64-vs2022
          extra_cmake_def: '-DWITH_TORCH=OFF'
        - build_name: windows-2022-cuda
          os: windows-2022
          vcpkg_bundle: vcpkg-export-66c0373d-x64-vs2022-cuda130
          cuda: '13.0.0'
          extra_cmake_def: '-DWITH_TORCH=ON'

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CUDA
      if: matrix.cuda
      uses: Jimver/cuda-toolkit@v0.2.30
      with:
        cuda: ${{ matrix.cuda }}
        use-github-cache: True

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-${{ matrix.vcpkg_bundle }}

    - name: Download vcpkg dependencies
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $archivePath = "${{ runner.workspace }}\vcpkg-export.7z"
        Invoke-WebRequest -Uri "${{ env.VCPKG_BUNDLE_RELEASE }}/${{ matrix.vcpkg_bundle }}.7z" -OutFile $archivePath
        & 7z x $archivePath "-o${{ runner.workspace }}\vcpkg_installed" -y
        Remove-Item $archivePath

    - name: Add vcpkg to PATH and env variable
      shell: pwsh
      run: |
        $vcpkg_path = "${{ runner.workspace }}\vcpkg_installed"
        echo "VCPKG_EXPORT_PATH=$vcpkg_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$vcpkg_path\installed\x64-windows-release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if ("${{ matrix.cuda }}" -ne "") {
          echo "$env:CUDA_PATH\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # cupti64_*.dll (needed by libtorch)
          echo "$env:CUDA_PATH\extras\CUPTI\lib64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$vcpkg_path\installed\x64-windows-release\tools\python3\Lib\site-packages\torch\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Configure CMake
      run: |
        cmake `
          -B ${{github.workspace}}/build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          ${{ matrix.extra_cmake_def }} `
          -DVCPKG_MANIFEST_INSTALL=OFF `
          -DVCPKG_TARGET_TRIPLET=x64-windows-release `
          -DVCPKG_INSTALLED_DIR="${{env.VCPKG_EXPORT_PATH}}/installed" `
          -DCMAKE_TOOLCHAIN_FILE="${{env.VCPKG_EXPORT_PATH}}/scripts/buildsystems/vcpkg.cmake" `
          -DTorch_DIR="${{env.VCPKG_EXPORT_PATH}}/installed/x64-windows-release/tools/python3/Lib/site-packages/torch/share/cmake/Torch"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      # Detect the sample object in the sample scene, without the GUI.
      # Not run on the CUDA build: the runner has no NVIDIA GPU or driver, so
      # it would only repeat the non-CUDA test on CPU. That job compiles and packages.
      if: ${{ !matrix.cuda }}
      shell: bash
      working-directory: ${{github.workspace}}/bin
      run: |
        ./Find-Object.exe --console --object box.png --scene box_in_scene.png 2>&1 | tee output.txt
        grep -q "Object 1 detected" output.txt

    - name: Build Windows Package
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "pull_request") {
          cpack --config build/CPackConfig.cmake -G ZIP -B build
        } else {
          cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target package
        }

    - name: Rename CUDA artifacts
      if: matrix.cuda
      shell: pwsh
      run: Get-ChildItem -Path "build" -Filter "Find-Object-*" -File | Rename-Item -NewName { $_.BaseName + "_cuda" + $_.Extension }

    - name: Upload Find-Object Artifacts (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: Find-Object-Binaries-${{ matrix.build_name }}-zip
        path: |
          build/Find-Object-*.zip
        compression-level: 0
        if-no-files-found: warn
        retention-days: ${{ github.event_name == 'pull_request' && 1 || 90 }}

    - name: Upload Find-Object Artifacts (Installer)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: Find-Object-Binaries-${{ matrix.build_name }}-exe
        path: |
          build/Find-Object-*.exe
        compression-level: 0
        if-no-files-found: warn
        retention-days: 90
