
name: ros2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ros2 ${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
        include:
        - ros_distro: rolling
          use_ros2_testing: true # Rolling on Ubuntu resolute is only in ros2-testing (nightly)
      fail-fast: false
    container:
      image: osrf/ros:${{ matrix.ros_distro }}-desktop
    steps:
    - uses: actions/checkout@v4
    - uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ matrix.ros_distro }}
        use-ros2-testing: ${{ matrix.use_ros2_testing || false }}
    - run: |
        DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt upgrade -y
    - uses: ros-tooling/action-ros-ci@v0.4
      with:
        package-name: find_object_2d
        target-ros2-distro: ${{ matrix.ros_distro }}
